name: balance_arcade
description: Rollrise â€” a precision mechanical arcade game.
publish_to: none
version: 0.13.6+24
environment:
  sdk: '>=3.9.0 <4.0.0'
  flutter: '>=3.44.0'
dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.5
  audioplayers: ^6.8.1
  cupertino_icons: ^1.0.9
  firebase_core: ^4.15.0
  firebase_analytics: ^12.6.0
  google_mobile_ads: ^9.1.0
dev_dependencies:
  shared_preferences_platform_interface: ^2.4.2
  flutter_test:
    sdk: flutter
flutter:
  uses-material-design: true
  # Montserrat, cut down to the letters of the ROLLRISE wordmark (SIL OFL).
  fonts:
    - family: RollriseTitle
      fonts:
        - asset: assets/fonts/Montserrat-ExtraLight-Title.ttf
          weight: 200
        - asset: assets/fonts/Montserrat-ExtraBold-Title.ttf
          weight: 800
  assets:
    - assets/privacy/policy.json
    - assets/fonts/Montserrat-OFL.txt
    # Equal-length Infinite arrangements; draft recordings are not bundled.
    - assets/audio/theme_infinite_climb.wav
    - assets/audio/theme_infinite_fast.wav
    - assets/audio/theme_infinite_boss.wav
    - assets/audio/theme_classic_1_40.wav
